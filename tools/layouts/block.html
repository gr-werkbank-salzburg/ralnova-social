<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0}
.post{width:1080px;height:1350px;background:$bg;color:$fg;font-family:'Source Sans 3','Liberation Sans',Arial,sans-serif;display:flex;flex-direction:column}
.panel{background:$accent;color:$onaccent;padding:88px 88px 72px;display:flex;flex-direction:column;gap:56px;min-height:640px;box-sizing:border-box;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:34px;letter-spacing:.02em}
.kicker{font-size:24px;letter-spacing:.08em;opacity:.85}
h1{margin:0;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:900;font-size:$hsize;line-height:1.02;letter-spacing:-.02em}
.rest{flex:1;padding:72px 88px 88px;display:flex;flex-direction:column;justify-content:space-between}
p{margin:0;font-size:40px;line-height:1.35;color:$body;white-space:pre-line}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:32px}
.foot{font-size:30px;line-height:1.4;color:$muted;white-space:pre-line}
.cta{background:$ctabg;color:$ctafg;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:32px;padding:26px 40px;border-radius:8px;white-space:nowrap}
</style></head><body><div class="post">
<div class="panel"><div class="top"><div class="brand">RALNOVA CONNECT</div><div class="kicker">$kicker</div></div><h1>$headline</h1></div>
<div class="rest"><p>$body_text</p><div class="bottom"><div class="foot">$footer</div><div class="cta">$cta</div></div></div>
</div></body></html>
