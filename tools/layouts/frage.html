<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0}
.post{width:1080px;height:1350px;box-sizing:border-box;padding:96px 88px;background:$accent;color:$onaccent;font-family:'Source Sans 3','Liberation Sans',Arial,sans-serif;display:flex;flex-direction:column;justify-content:space-between;text-align:center;align-items:center}
.brand{font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:32px;letter-spacing:.12em}
.kicker{font-size:24px;letter-spacing:.1em;opacity:.8;margin-top:12px}
h1{margin:0;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:900;font-size:$hsize;line-height:1.02;letter-spacing:-.02em}
p{margin:40px auto 0;font-size:38px;line-height:1.4;white-space:pre-line;max-width:820px;opacity:.92}
.foot{font-size:28px;line-height:1.4;white-space:pre-line;opacity:.85;margin-bottom:28px}
.cta{display:inline-block;background:$onaccent;color:$accent;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:32px;padding:26px 44px;border-radius:999px;white-space:nowrap}
</style></head><body><div class="post">
<div><div class="brand">RALNOVA CONNECT</div><div class="kicker">$kicker</div></div>
<div><h1>$headline</h1><p>$body_text</p></div>
<div><div class="foot">$footer</div><div class="cta">$cta</div></div>
</div></body></html>
