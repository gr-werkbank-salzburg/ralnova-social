<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0}
.post{width:1080px;height:1350px;box-sizing:border-box;padding:88px;background:$bg;color:$fg;font-family:'Source Sans 3','Liberation Sans',Arial,sans-serif;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:32px}
.brand span{color:$accent}
.kicker{font-size:24px;color:$muted;letter-spacing:.08em}
h1{margin:0;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:900;font-size:$hsize_small;line-height:1.05;letter-spacing:-.02em}
.items{display:flex;flex-direction:column}
.item{display:flex;gap:36px;align-items:baseline;padding:30px 0;border-top:2px solid $rule}
.num{font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:900;font-size:64px;color:$accent;min-width:72px}
.txt{font-size:40px;line-height:1.3;color:$body}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:32px}
.foot{font-size:30px;line-height:1.4;color:$muted;white-space:pre-line}
.cta{background:$ctabg;color:$ctafg;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:32px;padding:26px 40px;border-radius:8px;white-space:nowrap}
</style></head><body><div class="post">
<div class="top"><div class="brand">RALNOVA <span>CONNECT</span></div><div class="kicker">$kicker</div></div>
<h1>$headline</h1>
<div class="items">$items</div>
<div class="bottom"><div class="foot">$footer</div><div class="cta">$cta</div></div>
</div></body></html>
