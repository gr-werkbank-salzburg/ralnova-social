<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0}
.post{width:1080px;height:1350px;box-sizing:border-box;padding:48px;background:$bg;font-family:'Source Sans 3','Liberation Sans',Arial,sans-serif}
.frame{height:100%;box-sizing:border-box;border:14px solid $accent;padding:72px 64px;display:flex;flex-direction:column;justify-content:space-between;color:$fg}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:30px}
.brand span{color:$accent}
.kicker{font-size:22px;color:$muted;letter-spacing:.08em}
h1{margin:0;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:900;font-size:calc($hsize * 0.78);line-height:1.04;letter-spacing:-.01em;text-transform:uppercase;overflow-wrap:break-word}
p{margin:44px 0 0;font-size:38px;line-height:1.38;color:$body;white-space:pre-line}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:28px}
.foot{font-size:28px;line-height:1.4;color:$muted;white-space:pre-line}
.cta{background:$ctabg;color:$ctafg;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:30px;padding:24px 36px;white-space:nowrap}
</style></head><body><div class="post"><div class="frame">
<div class="top"><div class="brand">RALNOVA <span>CONNECT</span></div><div class="kicker">$kicker</div></div>
<div><h1>$headline</h1><p>$body_text</p></div>
<div class="bottom"><div class="foot">$footer</div><div class="cta">$cta</div></div>
</div></div></body></html>
