<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0}
.post{width:1080px;height:1350px;box-sizing:border-box;padding:96px 96px;background:$bg;color:$fg;font-family:'Source Sans 3','Liberation Sans',Arial,sans-serif;display:flex;flex-direction:column;justify-content:space-between}
.brand{font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:30px;letter-spacing:.02em;color:$muted}
.brand span{color:$accent}
.mark{font-family:Georgia,'DejaVu Serif',serif;font-size:300px;line-height:.6;color:$accent;height:150px}
h1{margin:0;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:$hsize;line-height:1.08;letter-spacing:-.015em}
.mid{display:flex;flex-direction:column;gap:56px}
p{margin:0;font-size:38px;line-height:1.4;color:$body;white-space:pre-line;border-left:6px solid $accent;padding-left:36px}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:32px}
.foot{font-size:28px;line-height:1.4;color:$muted;white-space:pre-line}
.cta{border:3px solid $accent;color:$fg;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:30px;padding:24px 36px;border-radius:999px;white-space:nowrap}
</style></head><body><div class="post">
<div class="brand">RALNOVA <span>CONNECT</span> · $kicker</div>
<div class="mid"><div class="mark">“</div><h1>$headline</h1><p>$body_text</p></div>
<div class="bottom"><div class="foot">$footer</div><div class="cta">$cta</div></div>
</div></body></html>
