<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0;background:#F5F5F2}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;background:#F5F5F2;color:#111;font-family:'Liberation Sans',Arial,sans-serif}
.ring{position:absolute;border:6px solid rgba(31,95,168,.16);border-radius:50%}
.r1{width:900px;height:900px;right:-380px;top:120px;animation:spin1 10s ease-in-out forwards}
.r2{width:1300px;height:1300px;left:-700px;bottom:-300px;animation:spin2 10s ease-in-out forwards}
@keyframes spin1{from{transform:scale(.7)}to{transform:scale(1.15)}}
@keyframes spin2{from{transform:scale(1.1)}to{transform:scale(.85)}}
.c{position:absolute;inset:0;box-sizing:border-box;padding:290px 96px 340px;display:flex;flex-direction:column}
.brand{font-weight:700;font-size:44px;letter-spacing:.06em;opacity:0;animation:fade .6s ease-out .2s forwards}
.brand span{color:#1F5FA8}
.l{font-weight:900;font-size:128px;line-height:1.04;letter-spacing:-.02em;opacity:0}
.l1{margin-top:150px;animation:up .6s cubic-bezier(.2,.8,.2,1) .9s forwards}
.l2{animation:up .6s cubic-bezier(.2,.8,.2,1) 1.7s forwards}
.l3{color:#1F5FA8;animation:up .6s cubic-bezier(.2,.8,.2,1) 2.5s forwards}
.u{height:14px;width:0;background:#1F5FA8;margin-top:40px;animation:grow .7s ease-out 3.3s forwards}
@keyframes grow{to{width:420px}}
.p{margin-top:60px;font-size:52px;line-height:1.32;color:#333;opacity:0;animation:up .6s ease-out 4s forwards}
.cta{margin-top:auto;background:#1F5FA8;color:#fff;border-radius:20px;padding:44px 48px;font-weight:900;font-size:58px;line-height:1.12;opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) 5.6s forwards}
.cta small{display:block;font-weight:700;font-size:38px;margin-top:14px;opacity:.9}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
</style></head><body><div class="s">
<div class="ring r1"></div><div class="ring r2"></div>
<div class="c">
<div class="brand">RALNOVA <span>CONNECT</span></div>
<div class="l l1">Gutes Handwerk</div>
<div class="l l2">verdient einen Betrieb,</div>
<div class="l l3">der es sieht.</div>
<div class="u"></div>
<div class="p">Tischler, Elektriker, Maler und mehr: Wir bringen dich mit Betrieben in Salzburg zusammen, die gute Leute halten wollen.</div>
<div class="cta">Schreib uns „JOB“ per Nachricht.<small>Unverbindlich und diskret.</small></div>
</div>
</div></body></html>
