<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0;background:#1B1A18}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;background:#1B1A18;color:#F4EFE6;font-family:'Liberation Sans',Arial,sans-serif}
.c{position:absolute;inset:0;box-sizing:border-box;padding:290px 96px 340px;display:flex;flex-direction:column}
.brand{font-weight:700;font-size:44px;letter-spacing:.06em;opacity:0;animation:fade .6s ease-out .2s forwards}
.brand span{color:#E8833A}
.kick{margin-top:70px;font-size:42px;font-weight:700;color:#E8833A;letter-spacing:.08em;opacity:0;animation:up .5s ease-out .6s forwards}
.cta{margin-top:auto;background:#E8833A;color:#1B1A18;border-radius:20px;padding:38px 44px;font-weight:900;font-size:50px;line-height:1.12;opacity:0}
.cta small{display:block;font-weight:700;font-size:36px;margin-top:12px;opacity:.92}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.k{position:absolute;left:540px;top:1100px;border-radius:50%;border:5px solid rgba(232,131,58,.18);transform:translate(-50%,-50%) scale(.2);opacity:0}
.k1{width:700px;height:700px;animation:puls 4s ease-out 0s forwards,puls2 4s ease-out 4s forwards}
.k2{width:1100px;height:1100px;animation:puls 5s ease-out 1s forwards}
.k3{width:1600px;height:1600px;animation:puls 6s ease-out 2s forwards}
@keyframes puls{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1}100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}}
@keyframes puls2{to{opacity:.3;transform:translate(-50%,-50%) scale(1.15)}}.q{margin-top:28px;font-weight:900;font-size:96px;line-height:1.05;letter-spacing:-.02em;opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) 1s forwards}
.opts{margin-top:50px;display:flex;flex-direction:column;gap:20px}
.o{display:flex;align-items:center;gap:32px;background:rgba(244,239,230,.07);border:3px solid rgba(244,239,230,.22);border-radius:24px;padding:26px 36px;font-size:48px;font-weight:700;opacity:0}
.o i{font-style:normal;width:72px;height:72px;border-radius:50%;background:#E8833A;color:#1B1A18;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;flex:none}
.o1{animation:slide .5s cubic-bezier(.2,.8,.2,1) 2.6s forwards}.o2{animation:slide .5s cubic-bezier(.2,.8,.2,1) 3.1s forwards}.o3{animation:slide .5s cubic-bezier(.2,.8,.2,1) 3.6s forwards}
.cta{animation:up .6s cubic-bezier(.2,.8,.2,1) 4.8s forwards}
</style></head><body><div class="s">
<div class="k k1"></div><div class="k k2"></div><div class="k k3"></div>
<div class="c">
<div class="brand">RALNOVA <span>CONNECT</span></div>
<div class="kick">FRAGE AN ALLE BETRIEBE</div>
<div class="q">Woher kam euer letzter neuer Mitarbeiter?</div>
<div class="opts"><div class="o o1"><i>A</i>Über eine Empfehlung</div><div class="o o2"><i>B</i>Über eine Anzeige</div><div class="o o3"><i>C</i>Wir suchen noch</div></div>
<div class="cta">Schreibt uns A, B oder C per Nachricht.<small>Wir sind gespannt.</small></div>
</div>
</div></body></html>
