<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0;background:#EDE3D1}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;background:#EDE3D1;color:#2A2118;font-family:'Liberation Sans',Arial,sans-serif}
.c{position:absolute;inset:0;box-sizing:border-box;padding:290px 96px 340px;display:flex;flex-direction:column}
.brand{font-weight:700;font-size:44px;letter-spacing:.06em;opacity:0;animation:fade .6s ease-out .2s forwards}
.brand span{color:#7A4E2D}
.kick{margin-top:70px;font-size:42px;font-weight:700;color:#7A4E2D;letter-spacing:.08em;opacity:0;animation:up .5s ease-out .6s forwards}
.cta{margin-top:auto;background:#7A4E2D;color:#F7F0E3;border-radius:20px;padding:38px 44px;font-weight:900;font-size:50px;line-height:1.12;opacity:0}
.cta small{display:block;font-weight:700;font-size:36px;margin-top:12px;opacity:.92}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.dg{position:absolute;inset:-600px;background:repeating-linear-gradient(60deg,rgba(122,78,45,.08) 0 6px,transparent 6px 120px);animation:dg 10s linear forwards}
@keyframes dg{from{transform:translate(0,0)}to{transform:translate(-240px,140px)}}
.h{margin-top:28px;font-weight:900;font-size:104px;line-height:1.05;letter-spacing:-.02em;opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) 1s forwards}
.st{margin-top:70px;display:flex;flex-direction:column;gap:44px}
.x{display:flex;gap:36px;align-items:flex-start;opacity:0}
.x b{flex:none;width:96px;height:96px;border-radius:18px;background:#7A4E2D;color:#F7F0E3;font-size:56px;font-weight:900;display:flex;align-items:center;justify-content:center}
.x span{font-size:50px;line-height:1.25;font-weight:700;padding-top:12px}
.x1{animation:slide .5s ease-out 2.4s forwards}.x2{animation:slide .5s ease-out 3.2s forwards}.x3{animation:slide .5s ease-out 4s forwards}
.cta{animation:up .6s cubic-bezier(.2,.8,.2,1) 4.8s forwards}</style></head><body><div class="s">
<div class="dg"></div>
<div class="c">

<div class="st"><div class="x x1"><b>1</b><span>Kurz aufschreiben, was dich gerade stört.</span></div>
<div class="x x2"><b>2</b><span>Uns „JOB“ schreiben. Ohne Lebenslauf.</span></div>
<div class="x x3"><b>3</b><span>Ein Gespräch führen. Unverbindlich.</span></div></div>
<div class="cta">Schritt 2 geht gleich hier per Nachricht.<small>Diskret, dein Chef erfährt nichts.</small></div>
</div>
</div></body></html>
