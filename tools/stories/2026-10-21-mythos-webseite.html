<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0;background:#14213D}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;background:#14213D;color:#F5F3EE;font-family:'Liberation Sans',Arial,sans-serif}
.c{position:absolute;inset:0;box-sizing:border-box;padding:290px 96px 340px;display:flex;flex-direction:column}
.brand{font-weight:700;font-size:44px;letter-spacing:.06em;opacity:0;animation:fade .6s ease-out .2s forwards}
.brand span{color:#F2B33D}
.kick{margin-top:70px;font-size:42px;font-weight:700;color:#F2B33D;letter-spacing:.08em;opacity:0;animation:up .5s ease-out .6s forwards}
.cta{margin-top:auto;background:#F2B33D;color:#14213D;border-radius:20px;padding:38px 44px;font-weight:900;font-size:50px;line-height:1.12;opacity:0}
.cta small{display:block;font-weight:700;font-size:36px;margin-top:12px;opacity:.92}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.gr{position:absolute;inset:-300px;background-image:linear-gradient(rgba(242,179,61,.09) 3px,transparent 3px),linear-gradient(90deg,rgba(242,179,61,.09) 3px,transparent 3px);background-size:120px 120px;animation:gr 10s ease-in-out forwards}
@keyframes gr{from{transform:translate(0,0) rotate(0)}to{transform:translate(120px,-120px) rotate(4deg)}}
.lab{margin-top:70px;display:inline-block;align-self:flex-start;font-size:42px;font-weight:900;letter-spacing:.12em;padding:12px 26px;border-radius:10px;opacity:0}
.m{background:rgba(245,243,238,.12);color:#A9B3C7;animation:up .5s ease-out .6s forwards}
.myth{margin-top:28px;font-size:76px;font-weight:900;line-height:1.08;color:#A9B3C7;opacity:0;animation:up .6s ease-out 1s forwards}
.myth s{text-decoration:none;background:linear-gradient(#E26D5A,#E26D5A) no-repeat 0 55%/0% 8px;animation:cross .6s ease-out 2.4s forwards}
@keyframes cross{to{background-size:100% 8px}}
.w{margin-top:56px;background:#F2B33D;color:#14213D;animation:up .5s ease-out 3.1s forwards}
.truth{margin-top:28px;font-size:86px;font-weight:900;line-height:1.05;letter-spacing:-.01em;opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) 3.5s forwards}
.truth span{color:#F2B33D}
.cta{animation:up .6s cubic-bezier(.2,.8,.2,1) 4.8s forwards}</style></head><body><div class="s">
<div class="gr"></div>
<div class="c">
<div class="brand">RALNOVA <span>CONNECT</span></div>
<div class="lab m">MYTHOS</div>
<div class="myth"><s>„Ein Handwerksbetrieb braucht keine Webseite.“</s></div>
<div class="lab w">WAHRHEIT</div>
<div class="truth">Wer von euch hört, <span>googelt euch zuerst.</span></div>
<div class="cta">Wir bauen Webseiten fürs Handwerk.<small>Schreibt uns, wenn eure Seite fehlt.</small></div>
</div>
</div></body></html>
