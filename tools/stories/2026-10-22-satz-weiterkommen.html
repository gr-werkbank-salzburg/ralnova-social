<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0;background:#F4EFE6}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;background:#F4EFE6;color:#1B1A18;font-family:'Liberation Sans',Arial,sans-serif}
.c{position:absolute;inset:0;box-sizing:border-box;padding:290px 96px 340px;display:flex;flex-direction:column}
.brand{font-weight:700;font-size:44px;letter-spacing:.06em;opacity:0;animation:fade .6s ease-out .2s forwards}
.brand span{color:#B85A16}
.kick{margin-top:70px;font-size:42px;font-weight:700;color:#B85A16;letter-spacing:.08em;opacity:0;animation:up .5s ease-out .6s forwards}
.cta{margin-top:auto;background:#B85A16;color:#FFFFFF;border-radius:20px;padding:38px 44px;font-weight:900;font-size:50px;line-height:1.12;opacity:0}
.cta small{display:block;font-weight:700;font-size:36px;margin-top:12px;opacity:.92}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.gl{position:absolute;width:1300px;height:1300px;border-radius:50%;right:-500px;top:-200px;background:radial-gradient(circle,rgba(184,90,22,.25),transparent 62%);animation:gl 10s ease-in-out forwards}
.gl2{right:auto;left:-600px;top:1000px;animation:gl2 10s ease-in-out forwards}
@keyframes gl{from{transform:translateY(0) scale(.8)}to{transform:translateY(500px) scale(1.15)}}
@keyframes gl2{from{transform:scale(1.1)}to{transform:translateY(-300px) scale(.85)}}
.l{font-weight:900;font-size:120px;line-height:1.03;letter-spacing:-.02em;opacity:0}
.l1{margin-top:100px;animation:up .6s cubic-bezier(.2,.8,.2,1) .9s forwards}
.l2{animation:up .6s cubic-bezier(.2,.8,.2,1) 1.7s forwards}
.l3{color:#B85A16;animation:up .6s cubic-bezier(.2,.8,.2,1) 2.5s forwards}
.u{height:14px;width:0;background:#B85A16;margin-top:44px;animation:grow .7s ease-out 3.3s forwards}
@keyframes grow{to{width:360px}}
.p{margin-top:56px;font-size:50px;line-height:1.32;color:#3D3933;opacity:0;animation:up .6s ease-out 4s forwards}
.cta{animation:up .6s cubic-bezier(.2,.8,.2,1) 4.8s forwards}</style></head><body><div class="s">
<div class="gl"></div><div class="gl gl2"></div>
<div class="c">
<div class="brand">RALNOVA <span>CONNECT</span></div>
<div class="l l1">Weiterkommen</div>
<div class="l l2">fängt mit einem</div>
<div class="l l3">Gespräch an.</div>
<div class="u"></div>
<div class="p">Mehr Verantwortung, Spezialisierung oder Meister: Wir reden mit dir, was zu dir passt.</div>
<div class="cta">Schreib uns „JOB“ per Nachricht.<small>Unverbindlich und diskret.</small></div>
</div>
</div></body></html>
