<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0;background:#F5F5F2}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;background:#F5F5F2;color:#111111;font-family:'Liberation Sans',Arial,sans-serif}
.c{position:absolute;inset:0;box-sizing:border-box;padding:290px 96px 340px;display:flex;flex-direction:column}
.brand{font-weight:700;font-size:44px;letter-spacing:.06em;opacity:0;animation:fade .6s ease-out .2s forwards}
.brand span{color:#1F5FA8}
.kick{margin-top:70px;font-size:42px;font-weight:700;color:#1F5FA8;letter-spacing:.08em;opacity:0;animation:up .5s ease-out .6s forwards}
.cta{margin-top:auto;background:#1F5FA8;color:#FFFFFF;border-radius:20px;padding:38px 44px;font-weight:900;font-size:50px;line-height:1.12;opacity:0}
.cta small{display:block;font-weight:700;font-size:36px;margin-top:12px;opacity:.92}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.pt{position:absolute;inset:-200px;background-image:radial-gradient(rgba(31,95,168,.22) 8px,transparent 9px);background-size:110px 110px;animation:pt 10s linear forwards}
@keyframes pt{from{transform:translateY(0)}to{transform:translateY(-220px)}}.q{margin-top:28px;font-weight:900;font-size:96px;line-height:1.05;letter-spacing:-.02em;opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) 1s forwards}
.opts{margin-top:50px;display:flex;flex-direction:column;gap:20px}
.o{display:flex;align-items:center;gap:32px;background:rgba(17,17,17,.07);border:3px solid rgba(17,17,17,.22);border-radius:24px;padding:26px 36px;font-size:48px;font-weight:700;opacity:0}
.o i{font-style:normal;width:72px;height:72px;border-radius:50%;background:#1F5FA8;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;flex:none}
.o1{animation:slide .5s cubic-bezier(.2,.8,.2,1) 2.6s forwards}.o2{animation:slide .5s cubic-bezier(.2,.8,.2,1) 3.1s forwards}.o3{animation:slide .5s cubic-bezier(.2,.8,.2,1) 3.6s forwards}
.cta{animation:up .6s cubic-bezier(.2,.8,.2,1) 4.8s forwards}
</style></head><body><div class="s">
<div class="pt"></div>
<div class="c">
<div class="brand">RALNOVA <span>CONNECT</span></div>
<div class="kick">KURZE FRAGE AN DICH</div>
<div class="q">Was nervt dich im Job am meisten?</div>
<div class="opts"><div class="o o1"><i>A</i>Unbezahlte Fahrzeiten</div><div class="o o2"><i>B</i>Kaputtes Werkzeug</div><div class="o o3"><i>C</i>Keiner sagt Danke</div></div>
<div class="cta">Schreib uns A, B oder C per Nachricht.<small>Wir lesen alles.</small></div>
</div>
</div></body></html>
