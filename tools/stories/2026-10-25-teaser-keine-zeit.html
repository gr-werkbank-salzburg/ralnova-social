<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0;background:#1B1A18}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;background:#1B1A18;color:#F4EFE6;font-family:'Liberation Sans',Arial,sans-serif}
.c{position:absolute;inset:0;box-sizing:border-box;padding:290px 96px 340px;display:flex;flex-direction:column}
.brand{font-weight:700;font-size:44px;letter-spacing:.06em;opacity:0;animation:fade .6s ease-out .2s forwards}
.brand span{color:#E8833A}
.kick{margin-top:70px;font-size:42px;font-weight:700;color:#E8833A;letter-spacing:.08em;opacity:0;animation:up .5s ease-out .6s forwards}
.cta{margin-top:auto;background:#E8833A;color:#1B1A18;border-radius:20px;padding:38px 44px;font-weight:900;font-size:50px;line-height:1.12;opacity:0}
.cta small{display:block;font-weight:700;font-size:36px;margin-top:12px;opacity:.92}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.q0{position:absolute;border:6px solid rgba(232,131,58,.16);border-radius:40px}
.qa{width:700px;height:700px;right:-260px;top:160px;animation:qa 10s linear forwards}
.qb{width:1000px;height:1000px;left:-560px;bottom:-200px;animation:qb 10s linear forwards}
@keyframes qa{from{transform:rotate(0)}to{transform:rotate(60deg)}}
@keyframes qb{from{transform:rotate(15deg)}to{transform:rotate(-40deg)}}
.badge{margin-top:70px;align-self:flex-start;background:#E8833A;color:#1B1A18;font-size:42px;font-weight:900;letter-spacing:.1em;padding:14px 28px;border-radius:999px;opacity:0;animation:pop .45s ease-out .7s forwards}
.qm{margin-top:60px;font-size:200px;line-height:.6;font-weight:900;color:#E8833A;opacity:0;animation:fade .5s ease-out 1.3s forwards}
.t{margin-top:70px;font-weight:900;font-size:120px;line-height:1.04;letter-spacing:-.02em;opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) 1.7s forwards}
.p{margin-top:60px;font-size:50px;line-height:1.32;color:#D9D2C6;opacity:0;animation:up .6s ease-out 3.4s forwards}
.cta{animation:up .6s cubic-bezier(.2,.8,.2,1) 4.8s forwards}</style></head><body><div class="s">
<div class="q0 qa"></div><div class="q0 qb"></div>
<div class="c">

<div class="badge">NEU IM FEED</div>
<div class="t">„Für so was hab ich keine Zeit.“</div>
<div class="p">Den Satz hören wir oft. Unsere Antwort steht im heutigen Beitrag.</div>
<div class="cta">Jetzt im Feed lesen.<small>Oder schreibt uns direkt.</small></div>
</div>
</div></body></html>
