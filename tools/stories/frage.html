<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
body{margin:0;background:#14213D}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;background:#14213D;color:#F5F3EE;font-family:'Liberation Sans',Arial,sans-serif}
.glow{position:absolute;width:1400px;height:1400px;border-radius:50%;left:-200px;top:200px;background:radial-gradient(circle,rgba(242,179,61,.22),transparent 60%);animation:breathe 10s ease-in-out forwards}
@keyframes breathe{0%{transform:scale(.8)}50%{transform:scale(1.1)}100%{transform:scale(.95)}}
.c{position:absolute;inset:0;box-sizing:border-box;padding:290px 96px 340px;display:flex;flex-direction:column}
.brand{font-weight:700;font-size:44px;letter-spacing:.06em;opacity:0;animation:fade .6s ease-out .2s forwards}
.brand span{color:#F2B33D}
.kick{margin-top:110px;font-size:42px;font-weight:700;color:#F2B33D;letter-spacing:.08em;opacity:0;animation:up .5s ease-out .6s forwards}
.q{margin-top:28px;font-weight:900;font-size:116px;line-height:1.05;letter-spacing:-.02em;opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) 1s forwards}
.opts{margin-top:80px;display:flex;flex-direction:column;gap:28px}
.o{display:flex;align-items:center;gap:32px;background:rgba(245,243,238,.08);border:3px solid rgba(245,243,238,.25);border-radius:24px;padding:34px 40px;font-size:52px;font-weight:700;opacity:0;transform:translateX(-80px)}
.o i{font-style:normal;width:72px;height:72px;border-radius:50%;background:#F2B33D;color:#14213D;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;flex:none}
.o1{animation:slide .5s cubic-bezier(.2,.8,.2,1) 2.8s forwards}
.o2{animation:slide .5s cubic-bezier(.2,.8,.2,1) 3.3s forwards}
.o3{animation:slide .5s cubic-bezier(.2,.8,.2,1) 3.8s forwards}
.cta{margin-top:auto;background:#F2B33D;color:#14213D;border-radius:20px;padding:44px 48px;font-weight:900;font-size:58px;line-height:1.12;opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) 5.4s forwards}
.cta small{display:block;font-weight:700;font-size:38px;margin-top:14px}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes slide{to{opacity:1;transform:none}}
</style></head><body><div class="s">
<div class="glow"></div>
<div class="c">
<div class="brand">RALNOVA <span>CONNECT</span></div>
<div class="kick">KURZE FRAGE AN ALLE BETRIEBE</div>
<div class="q">Wie sucht ihr gerade neue Leute?</div>
<div class="opts">
<div class="o o1"><i>A</i>Stellenanzeige im Jobportal</div>
<div class="o o2"><i>B</i>Mundpropaganda</div>
<div class="o o3"><i>C</i>Gar nicht, keine Zeit dafür</div>
</div>
<div class="cta">Schreibt uns A, B oder C per Nachricht.<small>Wir sagen euch ehrlich, was davon funktioniert.</small></div>
</div>
</div></body></html>
