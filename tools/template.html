<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
body{margin:0}
.post{width:1080px;height:1350px;box-sizing:border-box;padding:96px 88px;background:$bg;color:$fg;font-family:'Source Sans 3','Liberation Sans',Arial,sans-serif;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:34px;letter-spacing:.02em}
.brand span{color:$accent}
.kicker{font-size:26px;color:$muted;letter-spacing:.08em}
.mid{display:flex;flex-direction:column;gap:48px}
.bar{width:96px;height:10px;background:$accent}
h1{margin:0;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:900;font-size:$hsize;line-height:1.02;letter-spacing:-.02em}
p{margin:0;font-size:40px;line-height:1.35;color:$body;max-width:880px;white-space:pre-line}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;border-top:2px solid $rule;padding-top:40px}
.foot{font-size:32px;line-height:1.4;color:$body;white-space:pre-line}
.cta{background:$ctabg;color:$ctafg;font-family:Archivo,'Liberation Sans',Arial,sans-serif;font-weight:700;font-size:32px;padding:26px 40px;border-radius:8px;white-space:nowrap}
</style>
</head>
<body>
<div class="post">
<div class="top"><div class="brand">RALNOVA <span>CONNECT</span></div><div class="kicker">$kicker</div></div>
<div class="mid"><div class="bar"></div><h1>$headline</h1><p>$body_text</p></div>
<div class="bottom"><div class="foot">$footer</div><div class="cta">$cta</div></div>
</div>
</body>
</html>
